name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Releases publish to this repository, using the built-in token. They used to
  # go to a separate downloads repo because the source was private and the
  # artifacts had to be public; the source is public now, so that split only
  # bought a cross-repo credential to keep alive.
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  release-secrets:
    runs-on: ubuntu-latest
    name: Validate required release secrets
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

  verify:
    # macOS, not Linux: the gates include `cargo test`, and compiling the tauri
    # stack on Linux needs webkit2gtk/gtk system headers that hosted ubuntu
    # images do not carry. Running the gates on the platform we actually ship
    # from also keeps them representative.
    runs-on: macos-14
    name: Verify release candidate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "::error::Tag/version mismatch: ${GITHUB_REF_NAME} != v${VERSION}"
            exit 1
          fi
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          MAIN_COMMIT=$(git rev-parse origin/main)
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "::error::Tag commit is not origin/main HEAD: ${TAG_COMMIT} != ${MAIN_COMMIT}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm test
          npm run lint
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: [release-secrets, verify]
    # macos-14 is Apple Silicon and builds the sole release target natively.
    # Development remains cross-platform; the published desktop surface is
    # intentionally macOS arm64-only.
    runs-on: macos-14
    name: Build (macOS-arm64)
    # The built-in token replaces the App token, so the publishing jobs need
    # write access granted explicitly. Every other job stays read-only.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog for current version
        id: changelog
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BODY_EN=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md | awk -f scripts/strip-empty-sections.awk)
          BODY_ZH=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG-zh.md | awk -f scripts/strip-empty-sections.awk)
          # Release date: prefer the date on the CHANGELOG heading; fall back to today.
          RELEASE_DATE=$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")
          if [ -z "$RELEASE_DATE" ]; then RELEASE_DATE=$(date -u +%Y-%m-%d); fi
          {
            echo "body<<EOF"
            echo "## Patchbay ${{ github.ref_name }}"
            echo ""
            echo "发布日期：\`${RELEASE_DATE}\`"
            echo ""
            echo "$BODY_ZH"
            echo ""
            echo "### 当前校验状态"
            echo ""
            echo "- ✅ macOS arm64 构建、签名与公证通过（Apple Silicon）"
            echo "- ✅ TypeScript typecheck 通过"
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>English release notes</summary>"
            echo ""
            echo "Release date: \`${RELEASE_DATE}\`"
            echo ""
            echo "$BODY_EN"
            echo ""
            echo "### Current Verification"
            echo ""
            echo "- ✅ macOS arm64 build, signing, and notarization passed (Apple Silicon)"
            echo "- ✅ TypeScript typecheck passed"
            echo ""
            echo "</details>"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Standard hosted-runner signing: build a throwaway keychain in RUNNER_TEMP,
      # import the Developer ID cert, and let codesign use it. The runner is
      # ephemeral, so there is no human login keychain to protect or restore.
      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/patchbay-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed s/\"//g)"
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1)
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseCommitish: main
          releaseName: "Patchbay v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          retryAttempts: 2
          args: --target aarch64-apple-darwin

      - name: Verify signed and notarized macOS bundles
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Patchbay.app"
          DMG_PATH=$(find "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg" -maxdepth 1 -name 'Patchbay_*.dmg' -print -quit)
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH" >&2
            exit 1
          fi
          if [ -z "$DMG_PATH" ]; then
            echo "Expected Patchbay DMG not found" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          LOCAL_DMG_SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" \
            --repo "$RELEASE_REPOSITORY" \
            --clobber
          DMG_NAME=$(basename "$DMG_PATH")
          rm -f "/tmp/$DMG_NAME"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$RELEASE_REPOSITORY" \
            --pattern "$DMG_NAME" \
            --dir /tmp \
            --clobber
          UPLOADED_DMG_SHA=$(shasum -a 256 "/tmp/$DMG_NAME" | awk '{print $1}')
          if [ "$LOCAL_DMG_SHA" != "$UPLOADED_DMG_SHA" ]; then
            echo "::error::Uploaded DMG checksum mismatch"
            exit 1
          fi

  verify-updater-assets:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    name: Verify updater assets
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minisign
        run: |
          set -euo pipefail
          if ! command -v minisign >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install minisign
          fi

      - name: Validate updater metadata and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json=$(gh release view "${{ github.ref_name }}" \
            --repo "$RELEASE_REPOSITORY" \
            --json assets,isDraft,tagName)

          asset_names=$(echo "$release_json" | jq -r '.assets[]?.name')
          version=$(node -p "require('./package.json').version")
          expected_assets=$(printf '%s\n' \
            'latest.json' \
            "Patchbay_${version}_aarch64.dmg" \
            'Patchbay_aarch64.app.tar.gz' \
            'Patchbay_aarch64.app.tar.gz.sig' | sort)
          actual_assets=$(printf '%s\n' "$asset_names" | sed '/^$/d' | sort)
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "Unexpected release assets"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_assets" "$actual_assets"
            exit 1
          fi
          if ! echo "$release_json" | jq -e '.isDraft == true' >/dev/null; then
            echo "Release must remain draft until updater validation passes"
            exit 1
          fi

          rm -f /tmp/latest.json
          gh release download "${{ github.ref_name }}" \
            --repo "$RELEASE_REPOSITORY" \
            --pattern latest.json \
            --dir /tmp \
            --clobber

          jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json \
            | base64 --decode > /tmp/patchbay-updater.pub

          expected_platforms=$(printf '%s\n' \
            darwin-aarch64 \
            darwin-aarch64-app | sort)
          actual_platforms=$(jq -r '.platforms | keys[]' /tmp/latest.json | sort)
          if [ "$actual_platforms" != "$expected_platforms" ]; then
            echo "Unexpected updater platforms"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected_platforms" "$actual_platforms"
            exit 1
          fi

          for platform in \
            darwin-aarch64 \
            darwin-aarch64-app; do
            if ! jq -e --arg platform "$platform" \
              '.platforms[$platform].signature and .platforms[$platform].url' \
              /tmp/latest.json >/dev/null; then
              echo "Missing updater metadata for ${platform}"
              exit 1
            fi

            url=$(jq -r --arg platform "$platform" '.platforms[$platform].url' /tmp/latest.json)
            signature=$(jq -r --arg platform "$platform" '.platforms[$platform].signature' /tmp/latest.json)
            asset_name=${url##*/}
            if ! echo "$asset_names" | grep -Fxq "$asset_name" || \
              ! echo "$asset_names" | grep -Fxq "${asset_name}.sig"; then
              echo "Missing updater artifact or signature asset for ${platform}"
              exit 1
            fi

            rm -f "/tmp/$asset_name" "/tmp/${asset_name}.sig"
            gh release download "${{ github.ref_name }}" \
              --repo "$RELEASE_REPOSITORY" \
              --pattern "$asset_name" \
              --pattern "${asset_name}.sig" \
              --dir /tmp \
              --clobber

            uploaded_signature=$(tr -d '\r\n' < "/tmp/${asset_name}.sig")
            if [ "$uploaded_signature" != "$signature" ]; then
              echo "Updater signature metadata mismatch for ${platform}"
              exit 1
            fi
            base64 --decode < "/tmp/${asset_name}.sig" > "/tmp/${platform}.minisig"
            minisign -Vm "/tmp/$asset_name" \
              -x "/tmp/${platform}.minisig" \
              -p /tmp/patchbay-updater.pub
          done

          echo "Updater assets validation passed"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "$RELEASE_REPOSITORY" --draft=false --latest
